<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141c42" />
      <stop offset="60%" stop-color="#090d20" />
      <stop offset="100%" stop-color="#05060f" />
    </radialGradient>
    <radialGradient id="nebulaCore" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="20%" stop-color="#7ea0ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#b44dff" stop-opacity="0.6" />
      <stop offset="80%" stop-color="#5b7cfa" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#05060f" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="armGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4dff91" />
      <stop offset="40%" stop-color="#5b7cfa" />
      <stop offset="100%" stop-color="#b44dff" />
    </linearGradient>
    <linearGradient id="armGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6b9d" />
      <stop offset="50%" stop-color="#b44dff" />
      <stop offset="100%" stop-color="#7ea0ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGlow)" />

  <!-- Ambient Outer Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#nebulaCore)" opacity="0.6" filter="url(#glow)" />

  <!-- Spiral Nebula Arms -->
  <g transform="translate(256, 256) rotate(-25)">
    <!-- Arm 1 -->
    <path d="M 0 0 C 60 -40, 140 -20, 160 50 C 175 105, 120 160, 40 170 C -40 180, -120 140, -150 70" 
          fill="none" stroke="url(#armGrad1)" stroke-width="26" stroke-linecap="round" opacity="0.85" filter="url(#glow)" />
    <!-- Arm 2 -->
    <path d="M 0 0 C -60 40, -140 20, -160 -50 C -175 -105, -120 -160, -40 -170 C 40 -180, 120 -140, 150 -70" 
          fill="none" stroke="url(#armGrad2)" stroke-width="24" stroke-linecap="round" opacity="0.8" filter="url(#glow)" />

    <!-- Inner Core & Dust Ring -->
    <ellipse cx="0" cy="0" rx="48" ry="32" fill="#ffffff" opacity="0.9" filter="url(#glow)" transform="rotate(30)" />
    <ellipse cx="0" cy="0" rx="70" ry="46" fill="none" stroke="#7ea0ff" stroke-width="6" opacity="0.75" transform="rotate(30)" />
  </g>

  <!-- Parallax Foreground Stars -->
  <!-- Main 4-point Star -->
  <g transform="translate(330, 160)" filter="url(#starGlow)">
    <path d="M 0 -24 Q 0 0 -24 0 Q 0 0 0 24 Q 0 0 24 0 Q 0 0 0 -24" fill="#ffffff" />
    <circle cx="0" cy="0" r="5" fill="#ffd866" />
  </g>
  <!-- Medium Star -->
  <g transform="translate(170, 340)" filter="url(#starGlow)">
    <path d="M 0 -16 Q 0 0 -16 0 Q 0 0 0 16 Q 0 0 16 0 Q 0 0 0 -16" fill="#ffffff" />
    <circle cx="0" cy="0" r="3.5" fill="#7ea0ff" />
  </g>
  <!-- Small Stars -->
  <circle cx="160" cy="170" r="4.5" fill="#ffffff" opacity="0.9" />
  <circle cx="360" cy="330" r="4" fill="#ffd866" opacity="0.85" />
  <circle cx="210" cy="120" r="3" fill="#7ea0ff" opacity="0.8" />
  <circle cx="300" cy="380" r="3.5" fill="#ffffff" opacity="0.75" />
  <circle cx="390" cy="240" r="3" fill="#ff6b9d" opacity="0.8" />
  <circle cx="120" cy="260" r="3" fill="#4dff91" opacity="0.8" />
  <circle cx="260" cy="90" r="2.5" fill="#ffffff" opacity="0.7" />
  <circle cx="280" cy="420" r="2.5" fill="#7ea0ff" opacity="0.7" />
</svg>
